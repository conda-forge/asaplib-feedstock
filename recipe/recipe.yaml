schema_version: 1

context:
  name: asaplib
  version: "0.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/asaplib-${{ version }}.tar.gz
  sha256: 05c48d435a5ddbec8e4e04518f27761e1a00943aaf111a5e53fcaf0e24e9fefd

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - asap = asaplib.cli.cmd_asap:asap

requirements:
  host:
    - python ${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dscribe >=0.4.0
    - click >=7.0
    - numpy
    - scipy
    - scikit-learn
    - ase >=3.19.1
    - umap-learn
    - pyyaml
    - tqdm >=4.46.1
    - pandas

tests:
  - python:
      imports:
        - asaplib
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - asap --help

about:
  summary: Automatic Selection And Prediction tools for materials and molecules
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/BingqingCheng/ASAP

extra:
  recipe-maintainers:
    - jan-janssen
